name: Bug report
description: Something in the extension misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your ElevenLabs API key anywhere in this issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the steps that led to it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: st-version
    attributes:
      label: SillyTavern version
      placeholder: "1.12.x"
    validations:
      required: true

  - type: input
    id: ext-version
    attributes:
      label: Extension version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - eleven_v3
        - eleven_v3_conversational
        - other / not sure

  - type: textarea
    id: logs
    attributes:
      label: Browser console output
      description: Set `localStorage.elabsConvDebug = '1'` first for verbose logging. Redact any key.
      render: text
