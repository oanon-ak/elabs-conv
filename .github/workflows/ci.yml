name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate manifest.json
        run: npm run check:manifest

      - name: Lint
        run: npm run lint
